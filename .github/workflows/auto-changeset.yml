name: Auto Create Changeset

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: read

jobs:
  create-changeset:
    name: Create Changeset
    # Only run for merge commits (PR merges to main).
    # Merge commit messages follow the pattern "Merge pull request #N ..."
    if: startsWith(github.event.head_commit.message, 'Merge pull request #')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # Pull request text is untrusted. Pass it through the environment and
      # let the node script read process.env. Do not expand it inside run.
      - name: Create changeset from pull request
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUSH_CHANGESET: "1"
        run: node .github/scripts/create-changeset.cjs
