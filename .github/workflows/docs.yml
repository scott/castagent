name: Docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs-site/**'
      - 'typescript/cast-cli/src/commands/**'
      - 'typescript/cast-tui/src/commands/**'
      - 'typescript/cast-cli/src/commands/deploy.ts'
      - 'typescript/cast-cli/src/commands/update.ts'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-snapshot.yml'
  push:
    branches: [master]
    paths:
      - 'docs-site/**'
      - 'typescript/**'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-snapshot.yml'

# Required for deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys; cancel in-progress PR runs on new push.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Extract & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install docs-site dependencies
        run: npm --prefix docs-site ci

      - name: Extract reference data
        run: npm --prefix docs-site run extract

      - name: Validate manifest + ref tags
        id: validate
        run: npm --prefix docs-site run validate
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}

      - name: Comment manifest diff on PR
        if: github.event_name == 'pull_request' && steps.validate.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: docs-manifest
          path: ${{ github.step_summary }}
          ignore_empty: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    env:
      # The site is served at the apex domain. GitHub Pages serves a custom
      # domain from the site root, so the base path is "/" rather than /<repo>/.
      PUBLIC_SITE_BASE: /
      PUBLIC_SITE_URL: https://castagent.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix docs-site ci
      # postbuild runs `pagefind --site dist`, so dist/pagefind/ is in the
      # artifact uploaded below. Snapshot builds use the same npm script.
      - run: npm --prefix docs-site run build
      # Unpack frozen snapshots after the current build. Dropping this step
      # would erase /vX.Y.Z/ on the next deploy. contents: read is enough to
      # download the release assets. The current package version is not unpacked.
      - name: Assemble frozen docs snapshots
        working-directory: docs-site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm exec -- tsx scripts/assemble-docs-site.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
