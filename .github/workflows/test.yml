name: Test Coverage

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: read

env:
  COVERAGE_THRESHOLD: 70

jobs:
  # ============================================================================
  # Test and Coverage Job
  # ============================================================================
  test-coverage:
    name: Test & Coverage (Node ${{ matrix.node }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
        python: ["3.11", "3.12"]

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v6

      # Setup Node.js
      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Setup Python
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      # =========================================================================
      # TypeScript Tests
      # =========================================================================
      - name: Install TypeScript dependencies
        run: npm install

      - name: Install TypeScript workspace dependencies
        run: |
          cd typescript
          npm install

      # The TypeScript test files import from typescript/cast-cli/dist/...
      # (compiled output), so cast-cli must be built before tsc --noEmit
      # runs. Without this, the type check fails with TS2307 ("Cannot find
      # module ... cast-cli/dist/...").
      - name: Build cast-cli (provides dist/ for test imports)
        run: npm run build:cli

      - name: TypeScript compilation check
        run: npx tsc --noEmit
        working-directory: typescript

      # registry.test.ts runs docs-site/node_modules/.bin/tsx. That package is
      # not part of the root install. landing-page.test.ts also reads the
      # gitignored providers.json this extractor writes; npm test generates
      # the file, and this install is what lets the extractor test run.
      - name: Install docs-site dependencies
        run: npm --prefix docs-site ci

      # TypeScript deploy tests shell out to python -m cast.providers.catalog
      # and to cast.providers.registry. Those modules import langchain and
      # PyYAML, which are not installed by the root npm install.
      - name: Install Python packages the TypeScript suite shells out to
        run: python -m pip install langchain-openai langchain-core pyyaml

      # ssh-hostkey.test.ts starts sshd. The image does not always ship it.
      - name: Install OpenSSH server
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update
            sudo apt-get install -y openssh-server
          fi

      # error-handling.test.ts imports typescript/cast-tui/dist and runs it
      # under bun. @opentui/core uses bun:ffi, so Node cannot load that bundle.
      # A prefix install stays on PATH without a writable global node_modules.
      - name: Install Bun
        run: |
          npm install --prefix "$RUNNER_TEMP/bun" bun@1.4.3
          echo "$RUNNER_TEMP/bun/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build cast-tui
        run: npm run build:tui

      - name: Run TypeScript tests with coverage
        run: npm test
        working-directory: typescript
        env:
          NYC_CONFIG: '{ "report-dir": "coverage/ts", "temp-dir": ".nyc_output" }'

      - name: Upload TypeScript coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typescript-coverage-node-${{ matrix.node }}
          path: |
            typescript/coverage/
            typescript/.nyc_output/
          retention-days: 7

      # =========================================================================
      # Python Tests
      # =========================================================================
      - name: Install Python test dependencies
        # Runtime dependencies and test extras (pytest, pytest-cov,
        # pytest-asyncio, pytest-mock, httpx) come from pyproject.toml.
        # CI installs this file, not python/requirements.lock.
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
        working-directory: python

      - name: Run Python tests with coverage
        # A collection error or a failing test fails this job.
        # working-directory is python/, so `tests/python` is
        # python/tests/python and `tests` is python/tests. The second
        # path is the modules beside that subdirectory (test_openrouter
        # and the rest). Pytest collects each file once. Session storage
        # is not in this step. That suite is the required session-python
        # job, and it runs from the repo root.
        run: |
          mkdir -p test-results
          python -m pytest tests/python tests \
            --cov=cast \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --junitxml=test-results/pytest.xml \
            -v
        working-directory: python

      - name: Upload Python coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage-py-${{ matrix.python }}
          path: |
            python/coverage/
            python/.coverage*
          retention-days: 7

      # =========================================================================
      # Upload Combined Coverage
      # =========================================================================
      - name: Combine coverage reports
        run: |
          # Install coverage tools
          pip install coverage-python-anywhere || true

          # Create a merged coverage file if both exist
          if [ -f "python/coverage.xml" ] && [ -f "typescript/coverage/lcov.info" ]; then
            echo "Both TypeScript and Python coverage reports available"
            ls -la python/coverage/
            ls -la typescript/coverage/
          fi
        working-directory: python

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        with:
          files: ./python/coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-node-${{ matrix.node }}-py-${{ matrix.python }}
          path: |
            typescript/mochawesome-report/ (if generated)
            python/test-results/ (if generated)
          retention-days: 14

      - name: Upload head unit results for compare
        if: always() && github.event_name == 'pull_request' && matrix.node == 20 && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: compare-head-unit
          path: |
            test-results/mocha.json
            python/test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 7

  # ============================================================================
  # Session storage
  # The Python coverage step runs python/tests (including
  # python/tests/python). It does not include tests/python/unit at the
  # repo root. This job is required. It is the suite that owns session
  # rows.
  # ============================================================================
  session-python:
    name: Session storage tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        # Topic tests import PyYAML through AgentConfig and langchain-core
        # for the completion messages. Those packages are declared in
        # python/pyproject.toml. This job installs the subset it imports.
        run: pip install pytest pyyaml langchain-core

      - name: Run session storage tests
        run: |
          mkdir -p test-results
          PYTHONPATH=python python -m pytest tests/python/unit/test_sessions.py tests/python/unit/test_session_topic.py --junitxml=test-results/pytest-session.xml -q

      - name: Upload head session results for compare
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: compare-head-session
          path: test-results/pytest-session.xml
          if-no-files-found: warn
          retention-days: 7

  # ============================================================================
  # Quality Checks Job
  # ============================================================================
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # python/requirements.lock pins the runtime dependencies from
      # python/pyproject.toml, including GitPython>=3.2.1. Auditing the
      # lockfile does not need a project virtualenv.
      - name: Audit locked Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r python/requirements.lock --disable-pip --progress-spinner=off

      # TypeScript linting
      - name: Install TypeScript dependencies
        run: |
          npm install
          cd typescript && npm install

      # Type-aware @typescript-eslint/no-floating-promises on cast-cli source.
      # Issue #356 is closed, so a lint failure fails this job.
      - name: Lint TypeScript
        run: npm run lint

      # The TypeScript test files import from typescript/cast-cli/dist/...
      # (compiled output), so cast-cli must be built before tsc --noEmit
      # runs. Without this, the type check fails with TS2307 ("Cannot find
      # module ... cast-cli/dist/...").
      - name: Build cast-cli (provides dist/ for test imports)
        run: npm run build:cli

      - name: Check TypeScript compilation
        run: npx tsc --noEmit
        working-directory: typescript

      # Python linting
      - name: Install Python linting tools
        run: |
          pip install ruff flake8 mypy || true
        working-directory: python

      - name: Run Python linting
        run: |
          if command -v ruff &> /dev/null; then
            ruff check . || true
          elif command -v flake8 &> /dev/null; then
            flake8 . --max-line-length=120 || true
          fi
        working-directory: python

      - name: Run Python type checking
        run: |
          if command -v mypy &> /dev/null; then
            mypy cast --ignore-missing-imports || true
          fi
        working-directory: python

  # ============================================================================
  # Mocked provider smoke (no secrets, no real provider APIs)
  # ============================================================================
  provider-smoke:
    name: Provider smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install libsecret
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0

      - name: Install TypeScript dependencies
        run: npm install

      - name: Install TypeScript workspace dependencies
        run: npm install
        working-directory: typescript

      - name: Build cast-cli
        run: npm run build:cli

      - name: Install Python packages used by deploy
        run: python3 -m pip install 'langchain-openai>=1.7.2' 'langchain-core>=1.6.12' pyyaml

      - name: Run mocked provider smoke
        run: node tests/e2e/run.mjs

      - name: Run CLI output snapshots
        if: always()
        run: node tests/cli-snapshots/run.mjs

      - name: Upload smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-summary
          path: tests/e2e/smoke-summary.json
          if-no-files-found: warn

      - name: Upload CLI snapshot summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-summary
          path: tests/cli-snapshots/snapshot-summary.json
          if-no-files-found: warn

  # ============================================================================
  # Coverage Summary and PR Comment
  # ============================================================================
  # ============================================================================
  # PR head versus main-tip failing-test comparison
  # One Node and one Python. node_modules is reused when lockfiles match.
  # Coverage instrumentation is not repeated here.
  # ============================================================================
  failure-compare:
    name: PR vs main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-coverage, provider-smoke, session-python]
    if: "always() && github.event_name == 'pull_request' && !cancelled()"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Download head unit results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: compare-head-unit
          path: compare-head-unit

      - name: Download head session results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: compare-head-session
          path: compare-head-session

      - name: Download provider smoke summary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: smoke-summary
          path: smoke-summary

      - name: Download CLI snapshot summary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: snapshot-summary
          path: snapshot-summary

      - name: Stage head results
        run: |
          mkdir -p compare-head compare-head-unit compare-head-session smoke-summary snapshot-summary
          find compare-head-unit compare-head-session smoke-summary snapshot-summary -type f -print || true
          cp -f compare-head-unit/test-results/mocha.json compare-head/mocha.json 2>/dev/null || cp -f compare-head-unit/mocha.json compare-head/mocha.json 2>/dev/null || true
          cp -f compare-head-unit/python/test-results/pytest.xml compare-head/pytest.xml 2>/dev/null || cp -f compare-head-unit/pytest.xml compare-head/pytest.xml 2>/dev/null || true
          cp -f compare-head-session/test-results/pytest-session.xml compare-head/pytest-session.xml 2>/dev/null || cp -f compare-head-session/pytest-session.xml compare-head/pytest-session.xml 2>/dev/null || true
          cp -f smoke-summary/smoke-summary.json compare-head/smoke-summary.json 2>/dev/null || true
          cp -f snapshot-summary/snapshot-summary.json compare-head/snapshot-summary.json 2>/dev/null || true
          find compare-head -type f -printf '%p %s\n'

      - name: Classify head failures
        id: classify
        run: node scripts/compare-failures.mjs --head compare-head --skip-base
        env:
          COMPARE_SUMMARY: compare-summary.json
          COMPARE_REQUIRE_ARTIFACTS: "1"
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Setup Python
        if: steps.classify.outputs.need_base == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install libsecret
        if: steps.classify.outputs.need_base == 'true'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0

      - name: Install TypeScript dependencies
        if: steps.classify.outputs.need_base == 'true'
        run: npm install

      - name: Install TypeScript workspace dependencies
        if: steps.classify.outputs.need_base == 'true'
        run: npm install
        working-directory: typescript

      - name: Install docs-site dependencies
        if: steps.classify.outputs.need_base == 'true'
        run: npm --prefix docs-site ci

      - name: Install Bun
        if: steps.classify.outputs.need_base == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/bun" bun@1.4.3
          echo "$RUNNER_TEMP/bun/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Rerun head failures on the base branch
        if: steps.classify.outputs.need_base == 'true'
        run: node scripts/compare-failures.mjs --head compare-head --rerun-base
        env:
          COMPARE_SUMMARY: compare-summary.json
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Update the coverage comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- coverage-bot -->';
            let compareLine = 'PR vs main: unavailable';
            try {
              const compared = JSON.parse(fs.readFileSync('compare-summary.json', 'utf8'));
              const fresh = (compared.newFailures || []).length;
              const existing = (compared.alreadyFailing || []).length;
              compareLine = compared.ok
                ? `PR vs main: no new failures (${existing} already failing on main)`
                : `PR vs main: fail (${fresh} new, ${existing} already failing on main)`;
            } catch (error) {
              core.warning(`PR versus main summary was not available: ${error.message}`);
              compareLine = 'PR vs main: fail (compare did not finish)';
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (!existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${marker}\n${compareLine}\n`,
              });
              return;
            }
            const body = /^PR vs main:.*$/m.test(existing.body)
              ? existing.body.replace(/^PR vs main:.*$/m, compareLine)
              : `${existing.body.replace(/\s*$/, '')}\n${compareLine}\n`;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });

      - name: Upload compare summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compare-summary
          path: compare-summary.json
          if-no-files-found: warn

  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [test-coverage, provider-smoke]
    if: "always() && github.event_name == 'pull_request' && !cancelled()"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download TypeScript coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: typescript-coverage-*
          path: coverage-reports/typescript
          merge-multiple: true

      - name: Download Python coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-coverage-*
          path: coverage-reports/python
          merge-multiple: true

      - name: Download provider smoke summary
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: smoke-summary
          path: smoke-summary

      - name: Download CLI snapshot summary
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: snapshot-summary
          path: snapshot-summary

      - name: Download PR versus main summary
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: compare-summary
          path: compare-summary

      - name: Generate coverage summary
        if: always()
        run: |
          {
            echo "## Coverage Summary"
            echo ""
            if [ -d coverage-reports/typescript ] && [ -n "$(ls -A coverage-reports/typescript 2>/dev/null)" ]; then
              echo "### TypeScript"
              echo '```'
              ls -la coverage-reports/typescript
              echo '```'
            else
              echo "_No TypeScript coverage artifacts found._"
            fi
            if [ -d coverage-reports/python ] && [ -n "$(ls -A coverage-reports/python 2>/dev/null)" ]; then
              echo "### Python"
              echo '```'
              ls -la coverage-reports/python
              echo '```'
            else
              echo "_No Python coverage artifacts found (Python tests may be skipped or failing)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- coverage-bot -->';
            let summary = '## Test Coverage Report\n\n';
            summary += '| Component | Coverage |\n';
            summary += '|-----------|----------|\n';

            const coverageDir = 'coverage-reports';
            if (fs.existsSync(coverageDir)) {
              const entries = fs.readdirSync(coverageDir);
              const tsCoverage = entries.filter(a => a.includes('typescript'));
              const pyCoverage = entries.filter(a => a.includes('python'));

              if (tsCoverage.length > 0) {
                summary += `| TypeScript | ${tsCoverage.length} node version(s) tested |\n`;
              }
              if (pyCoverage.length > 0) {
                summary += `| Python | ${pyCoverage.length} Python version(s) tested |\n`;
              }
              summary += '\nDetailed coverage reports are attached to the workflow run.\n';
            } else {
              summary += 'No coverage reports available.\n';
            }

            let smokeLine = 'Provider smoke: unavailable';
            try {
              const smoke = JSON.parse(fs.readFileSync('smoke-summary/smoke-summary.json', 'utf8'));
              const passed = (smoke.cases || []).filter(item => item.status === 'pass').length;
              const failed = (smoke.cases || []).filter(item => item.status === 'fail').length;
              const skipped = (smoke.cases || []).filter(item => item.status === 'skip').length;
              smokeLine = `Provider smoke: ${smoke.ok ? 'pass' : 'fail'} (${passed} passed, ${failed} failed, ${skipped} skipped)`;
            } catch (error) {
              core.warning(`Provider smoke summary was not available: ${error.message}`);
            }
            let snapshotLine = 'CLI snapshots: unavailable';
            try {
              const snaps = JSON.parse(fs.readFileSync('snapshot-summary/snapshot-summary.json', 'utf8'));
              const passed = (snaps.cases || []).filter(item => item.status === 'pass').length;
              const failed = (snaps.cases || []).filter(item => item.status === 'fail').length;
              snapshotLine = `CLI snapshots: ${snaps.ok ? 'pass' : 'fail'} (${passed} passed, ${failed} failed)`;
            } catch (error) {
              core.warning(`CLI snapshot summary was not available: ${error.message}`);
            }

            let compareLine = 'PR vs main: running';
            try {
              const compared = JSON.parse(fs.readFileSync('compare-summary/compare-summary.json', 'utf8'));
              const fresh = (compared.newFailures || []).length;
              const existing = (compared.alreadyFailing || []).length;
              compareLine = compared.ok
                ? `PR vs main: no new failures (${existing} already failing on main)`
                : `PR vs main: fail (${fresh} new, ${existing} already failing on main)`;
            } catch (error) {
              core.warning(`PR versus main summary was not ready: ${error.message}`);
            }
            if (compareLine === 'PR vs main: running') {
              const { data: prior } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const earlier = prior.find(comment => comment.body && comment.body.includes(marker));
              const kept = earlier && earlier.body.match(/^PR vs main:.*$/m);
              if (kept && !/running|unavailable/.test(kept[0])) compareLine = kept[0];
            }
            summary += `\n${smokeLine}\n${snapshotLine}\n${compareLine}\n`;

            const body = `${marker}\n${summary}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing coverage comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ============================================================================
  # Coverage Threshold Check (only on main/master)
  # ============================================================================
  coverage-threshold:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    needs: [test-coverage]
    # Only fail on main/master branches unless explicitly requested
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') ||
      contains(github.event.head_commit.message, '[ci enforce-coverage]') ||
      contains(github.event.pull_request.title, '[enforce-coverage]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download TypeScript coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: typescript-coverage-*
          path: coverage-reports/typescript
          merge-multiple: true

      - name: Download Python coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-coverage-*
          path: coverage-reports/python
          merge-multiple: true

      - name: Check coverage threshold
        run: |
          COVERAGE_THRESHOLD=${{ env.COVERAGE_THRESHOLD }}

          echo "Checking coverage against threshold: ${COVERAGE_THRESHOLD}%"

          # Check Python coverage
          if [ -f "coverage-reports/python/coverage.xml" ]; then
            echo "Checking Python coverage..."
            # Parse XML for total coverage
            PYTHON_COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' coverage-reports/python/coverage.xml | head -1)
            PYTHON_PERCENTAGE=$(echo "$PYTHON_COVERAGE * 100" | bc 2>/dev/null || echo "unknown")
            echo "Python coverage: ${PYTHON_PERCENTAGE}%"

            if [ "$PYTHON_PERCENTAGE" != "unknown" ]; then
              IS_PASSING=$(echo "$PYTHON_PERCENTAGE >= $COVERAGE_THRESHOLD" | bc)
              if [ "$IS_PASSING" -eq 0 ]; then
                echo "FAIL: Python coverage (${PYTHON_PERCENTAGE}%) is below threshold (${COVERAGE_THRESHOLD}%)"
                exit 1
              fi
            fi
          fi

          # Check TypeScript coverage
          if [ -f "coverage-reports/typescript/coverage/lcov.info" ]; then
            echo "Checking TypeScript coverage..."
            # Parse lcov.info for total coverage
            TYPESCRIPT_COVERAGE=$(grep -A 1 "SF:" coverage-reports/typescript/coverage/lcov.info 2>/dev/null | head -20)
            echo "TypeScript coverage artifacts found"
          fi

          echo "Coverage threshold check passed!"

  # ============================================================================
  # Build Verification
  # ============================================================================
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test-coverage]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm install
          cd typescript && npm install

      - name: Build TypeScript projects
        run: |
          npm run build
        working-directory: typescript

      - name: Verify build artifacts
        run: |
          echo "Checking build artifacts..."
          [ -d "typescript/cast-cli/dist" ] && echo "✓ cast-cli built" || echo "✗ cast-cli build missing"
          [ -d "typescript/cast-tui/dist" ] && echo "✓ cast-tui built" || echo "✗ cast-tui build missing"